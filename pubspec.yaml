name: miss_you_lover
description: "想你 - 两台手机配对后，点击按钮在对方手机弹出爱心动画"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  web_socket_channel: ^3.0.1
  flutter_overlay_window: ^0.5.0
  permission_handler: ^11.3.1
  vibration: ^2.0.1
  shared_preferences: ^2.3.2
  logger: ^2.4.0
  provider: ^6.1.2
  device_info_plus: ^11.0.0
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
